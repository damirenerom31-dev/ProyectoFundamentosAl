<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mi perfil - minimarket damir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=inter:wght@300;400;500;600;700&family=poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="barra-navegacion">
        <div class="bloque-marca">
            <a href="{{ url_for('index') }}" class="enlace-home">
                <i class="fa-solid fa-store icono-tienda-logo"></i>
                <h1 class="logo-texto-principal">minimarket <span>damir</span></h1>
            </a>
        </div>
        <nav class="menu-navegacion-derecha">
            <ul class="lista-enlaces-navegacion">
                <li><a href="{{ url_for('index') }}" class="enlace-menu"><i class="fa-solid fa-house"></i> inicio</a></li>
                <li><a href="{{ url_for('carrito') }}" class="enlace-menu posicion-relativa"><i class="fa-solid fa-basket-shopping"></i> mi carrito <span id="contador-items-carrito-badge" class="badge-cantidad-carrito">0</span></a></li>
                
                <li>
                    <div class="bloque-usuario-menu">
                        <button class="btn-ingresar-login">
                            <i class="fa-solid fa-user"></i> {{ session['usuario_nombre'] }}
                        </button>
                        <div class="menu-desplegable-usuario">
                            <a href="{{ url_for('perfil') }}">mi perfil</a>
                            <a href="{{ url_for('logout') }}">cerrar sesión</a>
                        </div>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-tienda">
        <div class="contenedor-autenticacion" style="max-width: 600px;">
            <h2><i class="fa-solid fa-address-card" style="color: #ff6600; margin-right: 10px;"></i> mis datos personales</h2>
            
            <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 20px;">
                
                <div class="grupo-formulario">
                    <label><i class="fa-solid fa-user-tag"></i> nombre completo</label>
                    <div class="input-formulario" style="background-color: #fafafa; color: #555555;">
                        {{ usuario.nombre }} {{ usuario.apellido }}
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label><i class="fa-solid fa-mobile-screen-button"></i> número de celular</label>
                    <div class="input-formulario" style="background-color: #fafafa; color: #555555;">
                        {{ usuario.celular }}
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label><i class="fa-solid fa-envelope"></i> correo electrónico</label>
                    <div class="input-formulario" style="background-color: #fafafa; color: #555555; text-transform: none !important;">
                        {{ correo }}
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label><i class="fa-solid fa-location-dot"></i> dirección de entrega</label>
                    <div class="input-formulario" style="background-color: #fafafa; color: #555555; height: auto; min-height: 44px;">
                        {{ usuario.direccion }}
                    </div>
                </div>

                <div style="margin-top: 15px; display: flex; gap: 15px;">
                    <a href="{{ url_for('index') }}" class="btn-formulario-primario" style="text-align: center; background-color: #333333;">
                        <i class="fa-solid fa-arrow-left-long"></i> volver a la tienda
                    </a>
                    <a href="{{ url_for('logout') }}" class="btn-formulario-primario" style="text-align: center; background-color: #dc3545;">
                        <i class="fa-solid fa-power-off"></i> cerrar sesión
                    </a>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 minimarket damir. todos los derechos reservados.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
